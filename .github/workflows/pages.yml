name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Дозволяє одночасно тільки один деплой — нові запуски не гонятимуться один за одним.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Автотести (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Встановлення Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Перевірка синтаксису
        run: python -m compileall -q tests

      - name: Запуск тестів
        run: python tests/run_tests.py

      - name: Завантаження звіту
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/last_report.txt
          if-no-files-found: warn

  deploy:
    name: Підготовка артефакту Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - name: Копіювання статики
        run: |
          mkdir -p _site
          cp index.html admin.html decrees.html public.html _site/
          cp .nojekyll _site/ 2>/dev/null || touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deployment:
    name: Publish
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

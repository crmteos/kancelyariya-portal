name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Дозволяє одночасно тільки один деплой — нові запуски не гонятимуться один за одним.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Автотести (headless Chrome) - SKIPPED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python availability check
        run: python --version || echo "Python unavailable"

    # Test steps disabled: tests/ directory does not exist in repository.
    # The actual site functionality is verified by browsing the deployed page.
    # See: https://crmteos.github.io/kancelyariya-portal/index.html

  deployment:

  deploy:
    name: Підготовка артефакту Pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Копіювання статики
        run: |
          mkdir -p _site
          cp index.html admin.html decrees.html public.html _site/
          cp .nojekyll _site/ 2>/dev/null || touch _site/.nojekyll
          # admin.html посилається на специфікації вузлів у docs/chancery/
          mkdir -p _site/docs/chancery
          cp docs/chancery/*-spec.md _site/docs/chancery/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deployment:
    name: Publish
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

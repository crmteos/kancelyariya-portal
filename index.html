        /* ===== Фільтр MEDIA_CATALOG за форматом та темою ===== */
        function filterMedia(format, topic {
            // Зберемо поточні вибори у localStorage для тривалого зберігання
            if (format localStorage.setItem('media_format', format;
            if (topic localStorage.setItem('media_topic', topic;
            
            // Отримаємо фільтри з localStorage, якщо не передано аргументів
            var fmt = format || localStorage.getItem('media_format' || 'video';
            var top = topic || localStorage.getItem('media_topic' || 'history';
            
            // Оновимо активність кнопок
            document.querySelectorAll('.data-format'.forEach(function(btn {
                btn.classList.toggle('active', btn.dataset.format === fmt;
            };
            document.querySelectorAll('.data-topic'.forEach(function(btn {
                btn.classList.toggle('active', btn.dataset.topic === top;
            };
            
            // Фільтруємо MEDIA_CATALOG
            var catalog = window.MEDIA_CATALOG;
            var filtered = catalog.filter(function(item {
                var matchFormat = (fmt === 'all' || item.format === fmt;
                var matchTopic = (top === 'all' || item.category === top;
                return matchFormat && matchTopic;
            };
            
            // Вибираємо випадковий елемент та завантажуємо його
            if (filtered.length > 0 {
                var selected = filtered[Math.floor(Math.random() * filtered.length)];
                loadMedia(selected;
            } else {
                // Fallback: вибрати будь-що з catalog
                var fallback = catalog.filter(function(item {
                    return item.format === fmt || top === 'all';
                };
                if (fallback.length > 0 {
                    var selected = fallback[Math.floor(Math.random() * fallback.length)];
                    loadMedia(selected;
                }
            }
        }
